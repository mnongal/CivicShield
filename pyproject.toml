[project]
name = "civicshield"
version = "0.1.0"
description = "Transparent NYC assistance screening with a Python rules engine"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "SQLAlchemy==2.0.54", "python-dotenv==1.2.3"]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "httpx==0.28.1"]
postgres = ["psycopg[binary]>=3.2,<4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
